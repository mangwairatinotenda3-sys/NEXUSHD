name: Create Android signing key

# Makes the key that signs every NexusHD release and hands it to you as a
# download. You then paste the two values into Settings > Secrets > Actions
# yourself. Run this ONCE and keep the key safe: if it is lost, nobody can
# update the app without uninstalling it first.

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the key
        run: |
          set -eu
          PASS=$(openssl rand -hex 24)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore nexushd.keystore -alias nexushd \
            -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=NexusHD"
          mkdir key
          base64 -w0 nexushd.keystore > key/ANDROID_KEYSTORE_BASE64.txt
          printf '%s' "$PASS" > key/ANDROID_KEYSTORE_PASSWORD.txt
          cp nexushd.keystore key/nexushd.keystore
          rm -f nexushd.keystore

      - name: Keep the key for one day so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: nexushd-signing-key
          path: key/
          retention-days: 1
          if-no-files-found: error
